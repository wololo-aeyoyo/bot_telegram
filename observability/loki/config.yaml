# Minimal single-binary Loki for local/small deployments: everything in one
# process, chunks on the local filesystem. Not for HA — fine for a friend-group
# bot. Swap the storage for S3/GCS if this ever grows.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Required to accept `trace_id` as structured metadata from Alloy.
  allow_structured_metadata: true
  volume_enabled: true
  retention_period: 168h   # 7 days

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
